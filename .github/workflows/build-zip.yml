name: Test and Package Studio Novela

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-render-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Verificar TypeScript
        run: npm run check

      - name: Renderizar protótipo
        run: npm run render

      - name: Gerar ZIP do projeto
        if: success()
        run: |
          mkdir -p dist
          zip -r dist/studio-novela-v0.2.zip . \
            -x ".git/*" "node_modules/*" "dist/*" "out/*"

      - name: Guardar ZIP e vídeo renderizado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: studio-novela-prototipo-v0.2
          path: |
            dist/studio-novela-v0.2.zip
            out/prototipo-pov.mp4
          retention-days: 30
