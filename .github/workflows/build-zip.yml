name: Test and Package Studio Novela

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-render-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependências do projeto
        run: |
          npm install
          python -m pip install --upgrade pip
          python -m pip install edge-tts

      - name: Verificar TypeScript
        run: npm run check

      - name: Gerar vozes do episódio 1
        run: python scripts/generate_voices.py

      - name: Renderizar protótipo atual
        run: npm run render

      - name: Gerar ZIP do projeto
        if: success()
        run: |
          mkdir -p dist
          zip -r dist/studio-novela-v0.3.zip . \
            -x ".git/*" "node_modules/*" "dist/*" "out/*"

      - name: Guardar ZIP, vídeo e vozes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: studio-novela-ep001-audio-v0.3
          path: |
            dist/studio-novela-v0.3.zip
            out/prototipo-pov.mp4
            out/ep001-voices.wav
            out/voices/*.mp3
          retention-days: 30
